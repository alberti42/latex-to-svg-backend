# Byte-compilation, checkdoc and the ERT suite, on every push to main and
# every pull request.  The suite needs neither a TeX toolchain nor a
# graphical display, so the matrix job runs it as it stands; the one
# end-to-end test skips there and gets a job of its own below.
#
# The matrix is the declared floor (29.1, the `Package-Requires' of
# latex-to-svg-backend.el), then the newest of each series, then master.
#
# There is no Makefile: the library has no external dependencies, so the
# two commands below are the same ones the architecture notes give for
# running the checks by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Report version
        run: emacs --version | head -1

      - name: Byte-compile, warnings as errors
        run: |
          emacs -Q -batch --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile latex-to-svg-backend.el

      - name: Checkdoc
        run: |
          emacs -Q -batch --eval \
            '(progn (require (quote checkdoc)) (checkdoc-file "latex-to-svg-backend.el"))'

      - name: ERT
        run: |
          emacs -Q -batch -l ert -l tests/latex-to-svg-backend-tests.el \
            -f ert-run-tests-batch-and-exit

  render:
    runs-on: ubuntu-latest
    name: End-to-end against a real TeX toolchain
    # `latex-to-svg-backend-precompiled-compile-end-to-end' is the only test
    # that runs the real thing -- latex, dvisvgm and a `.fmt' dump -- and it
    # skips wherever they are missing, which is every other job here.  These
    # packages are what the default preamble and the precompilation need:
    # standalone + varwidth + mylatexformat (latex-extra), xcolor
    # (latex-recommended), amssymb's fonts (fonts-recommended).
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '29.1'

      - name: Install the TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended dvisvgm

      - name: Report versions
        run: |
          emacs --version | head -1
          latex --version | head -1
          dvisvgm --version
          kpsewhich mylatexformat.ltx

      - name: ERT
        run: |
          emacs -Q -batch -l ert -l tests/latex-to-svg-backend-tests.el \
            -f ert-run-tests-batch-and-exit
