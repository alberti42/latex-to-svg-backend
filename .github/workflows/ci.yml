# Byte-compilation, checkdoc and the ERT suite, on every push to main or
# ratex and every pull request.  The suite needs neither a TeX toolchain nor a
# graphical display, so the matrix job runs it as it stands; the
# end-to-end tests skip there and get a job of their own below.
#
# The matrix is the declared floor (29.1, the `Package-Requires' of
# latex-to-svg-backend.el), then the newest of each series, then master.
#
# There is no Makefile: the library has no external dependencies, so the
# two commands below are the same ones the architecture notes give for
# running the checks by hand.

name: CI

on:
  push:
    # `ratex' is the RaTeX renderer's development branch; drop it once
    # that work is merged.
    branches: [main, ratex]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Report version
        run: emacs --version | head -1

      # `-L .' lets each file `require' the others.
      - name: Byte-compile, warnings as errors
        run: |
          emacs -Q -batch -L . --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile latex-to-svg-backend-core.el \
            latex-to-svg-backend-latex.el latex-to-svg-backend-ratex.el \
            latex-to-svg-backend.el

      # Docstring conventions, exiting non-zero on any finding: `checkdoc-file'
      # only prints.  Both flags are set rather than left at their defaults,
      # so the step reports the same thing on every Emacs: the experimental
      # verb check defaults to t up to Emacs 30 and nil from 31.  The package
      # is loaded first, as melpazoid does: checkdoc flags an unquoted symbol
      # only when that symbol is defined.
      - name: Checkdoc
        run: |
          emacs -Q -batch -L . --eval '(progn
            (require (quote latex-to-svg-backend))
            (require (quote checkdoc))
            (setq checkdoc-force-docstrings-flag nil)
            (setq checkdoc-verb-check-experimental-flag nil)
            (dolist (file (quote ("latex-to-svg-backend-core.el"
                                  "latex-to-svg-backend-latex.el"
                                  "latex-to-svg-backend-ratex.el"
                                  "latex-to-svg-backend.el")))
              (checkdoc-file file))
            (if (get-buffer "*Warnings*")
                (kill-emacs 1)
              (message "checkdoc: clean")))'

      - name: ERT
        run: |
          emacs -Q -batch -l ert -l tests/latex-to-svg-backend-tests.el \
            -f ert-run-tests-batch-and-exit

  render:
    runs-on: ubuntu-latest
    name: Whole suite against a real Emacs, TeX toolchain and RaTeX
    # Five tests skip in every job above.  Three build an image and so need
    # an Emacs with librsvg, which the nix builds behind setup-emacs are
    # not -- they are minimal by design, no image support and no window
    # system -- so this job takes Emacs from apt instead.  The fourth,
    # `latex-to-svg-backend-precompiled-compile-end-to-end', runs the real
    # thing: latex, dvisvgm and a `.fmt' dump.  The TeX packages are what
    # the default preamble and the precompilation need: standalone +
    # varwidth + mylatexformat (latex-extra), xcolor (latex-recommended),
    # amssymb's fonts (fonts-recommended).  The fifth,
    # `latex-to-svg-backend-ratex-compile-end-to-end', needs RaTeX's
    # `render-svg', which this job takes from a RaTeX release.
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs and the TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            emacs texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended dvisvgm

      - name: Install RaTeX
        env:
          RATEX: ratex-cli-v0.1.14-x86_64-unknown-linux-musl
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/erweixin/RaTeX/releases/download/v0.1.14/$RATEX.tar.gz" \
            | tar --extract --gzip --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$RATEX" >> "$GITHUB_PATH"

      - name: Report versions
        run: |
          emacs --version | head -1
          latex --version | head -1
          dvisvgm --version
          kpsewhich mylatexformat.ltx
          command -v render-svg

      # The point of this job is that nothing in it skips.  An Emacs
      # without SVG support would skip the three image tests silently, so
      # fail here instead.
      - name: Check that this Emacs renders SVG
        run: |
          emacs -Q -batch --eval \
            '(unless (image-type-available-p (quote svg)) (error "No SVG support"))'

      - name: ERT
        run: |
          emacs -Q -batch -l ert -l tests/latex-to-svg-backend-tests.el \
            -f ert-run-tests-batch-and-exit
